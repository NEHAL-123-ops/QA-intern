name: signup-automation
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -v
      - name: Run signup automation against the local mock
        run: |
          python mock_site/serve.py &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/register >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/register >/dev/null
          BASE_URL=http://127.0.0.1:8765 TEST_OTP=123456 python signup_automation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports, path: reports/latest }
